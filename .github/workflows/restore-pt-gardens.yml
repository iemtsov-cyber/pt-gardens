name: Restore original P.T. Gardens site

on:
  push:
    paths:
      - ".github/workflows/restore-pt-gardens.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Clone source repository
        run: git clone --depth 1 https://github.com/iemtsov-cyber/igor_news.git /tmp/igor_news

      - name: Replace target with only P.T. Gardens site
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/igor_news/docs/pt-gardens/. .
          touch .nojekyll

      - name: Commit restored site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original P.T. Gardens site"
          git push
